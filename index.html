function secMarks(s){if(s.marks!==''&&s.marks!=null&&!isNaN(parseFloat(s.marks)))return parseFloat(s.marks);

 else arr=s.items.map(()=>pm);

 return arr.reduce((a,b)=>a+b,0)}

const J=a=>a.map(x=>typeof x==='string'?x:x.html).join('');
function pageHtml(body,land,foot){return `<section class="page${land?' land':''}"><div class="pbody">${body}</div>${foot?`<div class="pfoot"><span>${esc(foot[0])}</span><span>${foot[1]}</span></div>`:''}</section>`}
function fit(items,rb,land){
  const m=$('#measure .page');m.className='page'+(land?' land':'');const mb=m.querySelector('.pbody');
  if(!items.length)return[rb([],true,true)];
  const over=()=>mb.scrollHeight>mb.clientHeight+1;const cuts=[];let start=0,i=0,guard=0;
  while(i<items.length&&guard++<5000){
    const it=items[i];
    if(it&&typeof it!=='string'&&it.brk&&i>start){cuts.push([start,i]);start=i;continue}
    mb.innerHTML=rb(items.slice(start,i+1),cuts.length===0,i===items.length-1);
    if(over()&&i>start){cuts.push([start,i]);start=i;continue}
    i++;
  }
  cuts.push([start,items.length]);
  return cuts.map((r,k)=>rb(items.slice(r[0],r[1]),k===0,r[1]===items.length));
}
function finish(bodies,land,foot){const n=bodies.length;return{land,pages:bodies.map((b,i)=>pageHtml(b,land,(n>1||foot)?[foot||'',n>1?N(i+1)+' / '+N(n):'']:null))}}

const signBox=(n,t)=>`<div class="signbox"><div class="signline"><b>${esc(n)}</b>${n&&t?'<br>':''}${esc(t)}</div></div>`;

const SECL={bn:['ক','খ','গ','ঘ','ঙ','চ','ছ','জ','ঝ','ঞ'],en:['A','B','C','D','E','F','G','H','I','J']};
function matchPerm(n,seed){const idx=[...Array(n).keys()];let x=(n*7919+seed)>>>0;const r=()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296};for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}if(n>1&&idx.every((v,i)=>v===i))idx.push(idx.shift());return idx}
function renderQP(){const q=S.qp,bn=S.docLang==='bn';
 const lab=bn?['ক','খ','গ','ঘ','ঙ','চ','ছ','জ']:['a','b','c','d','e','f','g','h'];const lb=k=>lab[k]||N(k+1);
 const nf=n=>N(n)+dpunct();
 const secTitle=(s,si)=>[q.secLabel?(bn?SECL.bn[si]+'-বিভাগ':'Section '+SECL.en[si]):'',s.title].filter(Boolean).join(': ');
 const secHead=(s,si)=>{const m=secMarks(s);const ch=parseInt(s.choose,10)>0?D('যেকোনো '+N(parseInt(s.choose,10))+'টি প্রশ্নের উত্তর দাও।','Answer any '+N(parseInt(s.choose,10))+' questions.'):'';const sub=[s.instr,ch].filter(Boolean).join(' ');
  return `<div class="sec"><div class="sec-t">${esc(secTitle(s,si))}${m?` <span style="font-weight:400">[${D('মান','Marks')}: ${N(fmtM(m))}]</span>`:''}</div>${sub?`<div class="sec-s">${esc(sub)}</div>`:''}</div>`};
 const fillH=t=>esc(t).replace(/_{3,}/g,'<span class="blank" style="min-width:90px"></span>');
 const head=dh()+pill(q.title)+(q.extra?`<div class="center" style="margin-top:-2px">${esc(q.extra)}</div>`:'')+`<div class="mrow"><span>${D('বিষয়','Subject')}: <b>${esc(q.subject)}</b></span><span>${D('পূর্ণমান','Full marks')}: <b>${N(q.full)}</b></span></div><div class="mrow"><span>${D('শ্রেণি','Class')}: <b>${esc(q.cls)}</b></span>${q.date?`<span>${D('তারিখ','Date')}: ${fdate(q.date)}</span>`:''}<span>${D('সময়','Time')}: <b>${N(q.time)}</b></span></div>`+(q.showStudent?`<div class="mrow" style="margin-top:8px"><span>${D('শিক্ষার্থীর নাম','Student name')}: <span class="blank" style="min-width:220px"></span></span><span>${D('রোল','Roll')}: <span class="blank" style="min-width:70px"></span></span></div>`:'')+`<div class="rule"></div>${q.instr?`<div class="note">${nl2br(q.instr)}</div>`:''}`;
 let run=0;const offs=q.sections.map(s=>{const o=q.numCont?run:0;run+=s.items.length;return o});
 const items=[head];
 q.sections.forEach((s,si)=>{const hd=secHead(s,si),off=offs[si];
  if(!s.items.length){items.push(hd);return}
  if(s.type==='match'){const n=s.items.length,perm=s.shuffle?matchPerm(n,s.id.length):[...Array(n).keys()];
   items.push(hd+`<table class="mt">${s.items.map((it,i)=>`<tr><td style="width:50%"><b>${nf(off+i+1)}</b> ${esc(it.l)}</td><td><b>${lb(i)}.</b> ${esc(s.items[perm[i]].r)}</td></tr>`).join('')}</table>`);return}
  s.items.forEach((it,i)=>{const num=`<div class="qn">${nf(off+i+1)}</div>`;let h;
   if(s.type==='mcq'){const ml=Math.max(0,...it.o.map(x=>(x||'').length));const cs=s.cols;const c=(cs&&cs!=='auto')?Number(cs):(ml>34?1:ml>16?2:Math.min(it.o.length,4));
    h=`<div class="q">${num}<div class="qb">${esc(it.q)}<div class="opts o${c}">${it.o.map((t,k)=>`<span><b>${lb(k)}.</b> ${esc(t)}</span>`).join('')}</div></div></div>`}
   else if(s.type==='cq')h=`<div class="q">${num}<div class="qb">${nl2br(it.stem)}${it.p.map((p,k)=>`<div class="part"><span class="pl">${lb(k)}.</span><span class="pt">${esc(p.t)}</span><span class="pm">${N(p.m)}</span></div>`).join('')}</div></div>`;
   else if(s.type==='short')h=`<div class="q">${num}<div class="qb">${nl2br(it.q)}</div>${it.m!==''&&it.m!=null?`<div class="pm">${N(it.m)}</div>`:''}</div>`;
   else if(s.type==='fill')h=`<div class="q">${num}<div class="qb">${fillH(it.q)}</div></div>`;
   else h=`<div class="q">${num}<div class="qb">${esc(it.q)}</div></div>`;
   items.push(i===0?hd+h:h)})});
 if(items.length===1)items.push(`<p class="note center">${D('বিভাগ ও প্রশ্ন যোগ করুন','Add sections and questions to see them here')}</p>`);
 if(q.showKey){const parts=[];q.sections.forEach((s,si)=>{if(!['mcq','tf','match'].includes(s.type)||!s.items.length)return;const off=offs[si];let cells;
   if(s.type==='mcq')cells=s.items.map((it,i)=>`<span>${N(off+i+1)} – ${lb(it.a)}</span>`);
   else if(s.type==='tf')cells=s.items.map((it,i)=>`<span>${N(off+i+1)} – ${it.a?D('সত্য','True'):D('মিথ্যা','False')}</span>`);
   else{const n=s.items.length,perm=s.shuffle?matchPerm(n,s.id.length):[...Array(n).keys()];cells=s.items.map((it,i)=>`<span>${N(off+i+1)} – ${lb(perm.indexOf(i))}</span>`)}
   parts.push(`<div class="sub">${esc(secTitle(s,si))}</div><div class="keygrid">${cells.join('')}</div>`)});
  if(parts.length)items.push({brk:true,html:`<div class="sec"><div class="sec-t">${D('উত্তরমালা','Answer Key')}</div></div>${parts.join('')}`})}
 return finish(fit(items,J,false),false,q.subject+' · '+q.cls)}

/* ---------- result sheet ---------- */
function gradeOf(p){return p>=80?['A+',5]:p>=70?['A',4]:p>=60?['A-',3.5]:p>=50?['B',3]:p>=40?['C',2]:p>=33?['D',1]:['F',0]}
const letterOf=g=>g>=5?'A+':g>=4?'A':g>=3.5?'A-':g>=3?'B':g>=2?'C':g>=1?'D':'F';
function calcRes(){const R=S.res;const subs=R.subjects.map(s=>({n:s.n,f:parseFloat(s.f)||0}));const pp=parseFloat(R.passPct);const passPct=isNaN(pp)?33:pp;const fullTotal=subs.reduce((a,s)=>a+s.f,0);
 const rows=R.students.map(st=>{let total=0,gps=0,fail=false;const marks=subs.map((s,k)=>{const v=parseFloat(st.m[k]);return isNaN(v)?null:v});const empty=marks.every(v=>v===null);
  const subRes=marks.map((v,k)=>{if(v===null){fail=true;return{v:null,g:'Ab',gp:0,fail:true}}total+=v;const pct=subs[k].f?v/subs[k].f*100:0;let[g,gp]=gradeOf(pct);const f=pct<passPct||g==='F';if(f){g='F';gp=0;fail=true}gps+=gp;return{v,g,gp,fail:f}});
  const gpa=(empty||fail||!subs.length)?0:gps/subs.length;return{roll:st.roll,name:st.name,subRes,total,empty,fail,gpa,letter:empty?'':(fail?'F':letterOf(gpa)),pct:fullTotal?total/fullTotal*100:0,pos:null}});
 const ok=rows.filter(r=>!r.empty&&!r.fail);ok.forEach(r=>{r.pos=1+ok.filter(o=>o.total>r.total).length});
 const filled=rows.filter(r=>!r.empty);return{subs,rows,fullTotal,n:filled.length,pass:ok.length}}
function renderRES(){const R=S.res,i=S.inst,c=calcRes(),gp=R.scheme==='gpa';
 if(R.mode==='ind')return renderInd(c);
 const many=R.subjects.length>9;
 const thead=`<tr><th>${D('রোল','Roll')}</th><th class="l">${D('নাম','Name')}</th>${c.subs.map(s=>`<th>${esc(s.n)}<br><span class="sm2">(${N(s.f)})</span></th>`).join('')}<th>${D('মোট','Total')}<br><span class="sm2">(${N(c.fullTotal)})</span></th><th>%</th>${gp?`<th>GPA</th><th>${D('গ্রেড','Grade')}</th>`:`<th>${D('ফল','Result')}</th>`}${R.showRank?`<th>${D('মেধাক্রম','Pos.')}</th>`:''}</tr>`;
 const rowH=r=>`<tr><td>${N(r.roll)}</td><td class="l">${esc(r.name)}</td>${r.subRes.map(x=>`<td>${x.v===null?(r.empty?'':D('অনু','Ab')):(x.fail?`<span class="fm">${N(x.v)}</span>`:N(x.v))}</td>`).join('')}<td>${r.empty?'':N(r.total)}</td><td>${r.empty?'':N(r.pct.toFixed(1))}</td>${gp?`<td>${r.empty?'':N(r.gpa.toFixed(2))}</td><td>${r.letter}</td>`:`<td>${r.empty?'':(r.fail?D('অনুত্তীর্ণ','Fail'):D('উত্তীর্ণ','Pass'))}</td>`}${R.showRank?`<td>${r.pos?N(r.pos):''}</td>`:''}</tr>`;
 const top=dh()+pill(R.exam)+`<div class="center" style="margin-bottom:6px">${D('শ্রেণি','Class')}: <b>${esc(R.cls)}</b>${R.section?' · '+D('শাখা','Section')+': <b>'+esc(R.section)+'</b>':''} · ${D('ফলাফল তালিকা','Tabulation sheet')}</div>`;
 const tail=`<div class="mrow" style="margin-top:8px"><span>${D('মোট পরীক্ষার্থী','Total examinees')}: <b>${N(c.n)}</b></span><span>${D('উত্তীর্ণ','Passed')}: <b>${N(c.pass)}</b></span><span>${D('অনুত্তীর্ণ','Failed')}: <b>${N(c.n-c.pass)}</b></span><span>${D('পাসের হার','Pass rate')}: <b>${N((c.n?c.pass/c.n*100:0).toFixed(1))}%</b></span></div><p class="note">${D('অনুত্তীর্ণ বিষয়ের নম্বর দাগ দেওয়া; অনু = অনুপস্থিত।','Failed subjects are underlined; Ab = absent.')}</p><div class="signrow" style="margin-top:30px"><div class="signbox"><div class="signline">${D('শ্রেণি শিক্ষক','Class Teacher')}</div></div>${signBox(i.signName,i.signTitle)}</div>`;
 const rb=(sl,first,last)=>`${first?top:`<div class="runhead">${esc(R.exam)} – ${esc(R.cls)}</div>`}<table class="dt ${many?'xs':'sm'}">${thead}${sl.join('')}</table>${last?tail:''}`;
 return finish(fit(c.rows.map(rowH),rb,true),true,i.name)}

/* ---------- field editing ---------- */
function onField(e){const el=e.target,p=el.dataset&&el.dataset.p;if(!p)return;
 let v;if(el.type==='checkbox')v=el.checked;else if(el.type==='radio'){if(!el.checked)return;v=Number(el.value)}else v=el.value;
 if(get(p)===v)return;
 setp(p,v);markDirty(p);
 if(p==='cert.kind'){const pr=PRE[v][S.docLang];S.cert.title=pr[0];S.cert.intro=pr[1];S.cert.body=pr[2]}
 if(p==='inst.name'){const sv=$('details.inst .sumv');if(sv)sv.textContent=v}
 afterEdit(!!el.dataset.rr||p==='cert.kind')}
document.addEventListener('input',onField);

document.addEventListener('toggle',e=>{const t=e.target;if(!t.matches)return;if(t.matches('details.inst'))instOpen=t.open;else if(t.matches('details.qsec')){if(t.open)QCLOSED.delete(t.dataset.sid);else QCLOSED.add(t.dataset.sid)}},true);
document.addEventListener('change',e=>{
 if(e.target.id==='doclang'){setDocLang(e.target.value,true);renderAll();save();return}
 if(e.target.id==='logoFile'){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,240/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.inst.logo=c.toDataURL('image/png');S.dirty.inst=true;instOpen=true;afterEdit(true)};img.onerror=()=>toast(L('ছবিটি পড়া যায়নি','Could not read the image'));img.src=rd.result};rd.readAsDataURL(f)}});

  if(!rows.length){toast(L('পেস্ট করা তালিকা পাওয়া যায়নি','No rows found in the pasted text'));return}
  const ns=S.res.subjects.length;S.res.students=rows.map(r=>({roll:r[0]||'',name:r[1]||'',m:Array.from({length:ns},(_,k)=>r[2+k]||'')}));S.dirty.res=true;afterEdit(true);toast(L('তালিকা আপডেট হয়েছে','List updated'))},
 'rc-addper'(){S.rc.periods.push({t:'',brk:false});S.rc.grid.forEach(g=>g.push(''));S.dirty.rc=true;afterEdit(true)},
 'rc-delper'(b){const i=+b.dataset.i;S.rc.periods.splice(i,1);S.rc.grid.forEach(g=>g.splice(i,1));S.dirty.rc=true;afterEdit(true)},
 'logo-del'(){S.inst.logo='';S.dirty.inst=true;afterEdit(true)}
};
function confirm2(b){if(b.dataset.armed){delete b.dataset.armed;return true}const t=b.textContent;b.dataset.armed='1';b.textContent=L('আবার ক্লিক করুন','Click again');setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=t}},3000);return false}
Object.assign(ACT,{
 'sec-add'(b){const t=b.dataset.v,s=secDef(t,S.docLang);s.items=blanks(t,t==='cq'?1:(t==='match'?4:3));S.qp.sections.push(s);S.dirty.qp=true;afterEdit(true)},
 'sec-del'(b){if(!confirm2(b))return;S.qp.sections.splice(+b.dataset.i,1);S.dirty.qp=true;afterEdit(true)},
 'sec-move'(b){const i=+b.dataset.i,j=i+(+b.dataset.d),a=S.qp.sections;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];S.dirty.qp=true;afterEdit(true)},
 'opt-add'(b){const it=get(b.dataset.path);if(it.o.length<8)it.o.push('');S.dirty.qp=true;afterEdit(true)},
 'opt-del'(b){const it=get(b.dataset.path),k=+b.dataset.i;if(it.o.length<=2)return;it.o.splice(k,1);if(it.a===k)it.a=0;else if(it.a>k)it.a--;S.dirty.qp=true;afterEdit(true)},
 'qp-fullsum'(){S.qp.full=fmtM(qpTotal());S.dirty.qp=true;afterEdit(true)},
 'qp-preset'(b){if(S.dirty.qp&&!b.dataset.armed){b.dataset.armed='1';b.textContent=L('আবার ক্লিক করুন','Click again');setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.label}},3000);return}
  Object.assign(S.qp,PRESETS[b.dataset.v].f(S.docLang));S.dirty.qp=true;renderForm();renderPreview();save();toast(L('প্যাটার্ন সাজানো হয়েছে','Pattern applied'))}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b,e)});

/* ---------- PDF ---------- */
function setBusy(on){busy=on;['#pdfbtn','#pdfbtn2'].forEach(s=>{const b=$(s);b.disabled=on;b.textContent=on?L('তৈরি হচ্ছে…','Working…'):L('PDF ডাউনলোড','Download PDF')})}
async function saveFile(blob,name){
 let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){dl=null}
 if(dl){try{await dl.save({filename:name,data:blob});toast(L('PDF সংরক্ষণ করা হয়েছে','PDF saved'));return}catch(e){if(e&&e.code==='declined'){toast(L('সংরক্ষণ বাতিল করা হয়েছে','Save cancelled'));return}throw e}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
 toast(L('ডাউনলোড শুরু হয়েছে','Download started'))}
async function exportPdf(){
 if(busy)return;
 if(!window.html2canvas||!window.jspdf){toast(L('PDF লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ দেখে পেজ রিলোড করুন।','PDF library did not load. Check your connection and reload.'));return}
 setBusy(true);let cap=null;
 try{
  renderPreview();const r=last,land=r.land;
  try{await document.fonts.ready}catch(e){}
  cap=document.createElement('div');cap.id='cap';cap.style.cssText='position:absolute;left:-30000px;top:0;width:'+(land?1123:794)+'px';cap.innerHTML=r.pages.join('');document.body.appendChild(cap);
  const els=$$('.page',cap);const pdf=new window.jspdf.jsPDF({orientation:land?'l':'p',unit:'mm',format:'a4',compress:true});
  const pw=land?297:210,ph=land?210:297,scale=els.length>20?1.5:2;
  for(let i=0;i<els.length;i++){
   toast(L('PDF তৈরি হচ্ছে… ','Creating PDF… ')+NU(i+1)+'/'+NU(els.length),true);
   const canvas=await window.html2canvas(els[i],{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:1400,windowHeight:1200,onclone:d=>{const c=d.getElementById('cap');if(c)c.style.left='0px'}});
   if(i>0)pdf.addPage('a4',land?'l':'p');
   pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,pw,ph,undefined,'FAST');
   await new Promise(res=>setTimeout(res,0));
  }
  cap.remove();cap=null;
  const nm=(S.view==='res'&&S.res.mode==='ind'?'marksheets':VIEWS[S.view].file)+'-'+iso(TODAY)+'.pdf';
  await saveFile(pdf.output('blob'),nm);
 }catch(err){console.error(err);toast(L('PDF তৈরি করা যায়নি। আবার চেষ্টা করুন।','Could not create the PDF. Please try again.'))}
 finally{if(cap)cap.remove();setBusy(false)}}

/* ---------- start ---------- */
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&typeof o==='object')Object.assign(S,o)}}catch(e){}
 if(S.qp&&typeof S.qp==='object'&&!S.qp.sections)S.qp=migrateQP(S.qp);const base=sampleAll(S.docLang);KEYS.forEach(k=>{if(!S[k]||typeof S[k]!=='object')S[k]=base[k]});if(!S.dirty||typeof S.dirty!=='object')S.dirty={};if(!VIEWS[S.view])S.view='qp';S.pane='edit'}
load();renderAll();
if(document.fonts){document.fonts.ready.then(()=>renderPreview());document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',schedulePreview)}
window.addEventListener('resize',fitStage);
</script>
